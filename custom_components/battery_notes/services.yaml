set_battery_replaced:
  name: Set battery replaced
  description: "Set the battery last replaced."
  fields:
    device_id:
      name: Device
      description: Device that has had its battery replaced.
      required: false
      selector:
        device:
    source_entity_id:
      name: Entity
      description: "Entity that has had its battery replaced (only used for entity associated battery notes)."
      required: false
      selector:
        entity:
    datetime_replaced:
      name: Date
      description: Date replaced.
      required: false
      selector:
        datetime:
    battery_level:
      name: Initial battery level
      description: Measured percentage just after replacement; required when importing historical dates.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box
          unit_of_measurement: "%"
    trend_samples:
      name: Historical trend samples
      description: Optional list of up to 140 measured time/level pairs from this battery cycle. The first 72 hours are excluded from the trend.
      required: false
      selector:
        object:
    estimated:
      name: Estimated replacement
      description: Mark a date inferred from historical readings.
      required: false
      default: false
      selector:
        boolean:
    uncertainty_hours:
      name: Time uncertainty (hours)
      description: Resolution or uncertainty of the historical timestamp.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 87600
          mode: box
          unit_of_measurement: h
check_battery_last_replaced:
  name: Check battery replaced
  description: Get or raise events for devices that haven't had their battery replaced.
  fields:
    days_last_replaced:
      name: Days
      description: Number of days since a device last had its battery replaced.
      required: true
      selector:
        number:
          min: 1
          max: 720
          mode: box
    raise_events:
      name: Raise events
      description: Raise events for use in automation triggers.
      required: false
      default: true
      selector:
        boolean:
check_battery_last_reported:
  name: Check battery reported
  description: "Get or raise events for devices that haven't reported their battery level."
  fields:
    days_last_reported:
      name: Days
      description: Number of days since a device last reported its battery level.
      required: true
      selector:
        number:
          min: 1
          max: 100
          mode: box
    raise_events:
      name: Raise events
      description: Raise events for use in automation triggers.
      required: false
      default: true
      selector:
        boolean:

check_battery_low:
  name: Check battery low
  description: "Get or raise events for devices that have a low battery."
  fields:
    raise_events:
      name: Raise events
      description: Raise events for use in automation triggers.
      required: false
      default: true
      selector:
        boolean:

import_battery_history:
  name: Import battery history
  description: Import observed percentages without changing the last replacement date.
  fields:
    device_id:
      name: Device
      selector:
        device:
    source_entity_id:
      name: Entity
      selector:
        entity:
    trend_samples:
      name: Historical samples
      description: Up to 140 measured time/level pairs; do not cross a battery replacement.
      required: true
      selector:
        object:
    detect_replacements:
      name: Detect replacements
      description: Treat future rises above ten percentage points as estimated replacements for this note.
      default: false
      selector:
        boolean:
